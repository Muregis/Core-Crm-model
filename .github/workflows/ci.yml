name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check entrypoints
        run: |
          node --check server.js
          node --check scripts/migrate.js
          node --check workers/report.worker.js
          node --check src/queue/events.js
          node --check src/routes/jobs.js
          node --check src/routes/reports.js
          node --check src/routes/analytics.js
          node --check src/routes/parcels.js
          node --check src/controllers/parcelController.js

      - name: Run test suite
        run: npm test -- --passWithNoTests
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_1234567890
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api

  docker-compose-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker compose
        run: docker compose config
